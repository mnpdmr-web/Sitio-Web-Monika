<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Realidad Aumentada</title>

<!-- Model Viewer -->
<script type="module"
src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
</script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{

    background:linear-gradient(135deg,#1E3C72,#2A5298);

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

}

.contenedor{

    width:95%;

    max-width:900px;

    background:white;

    border-radius:20px;

    box-shadow:0px 15px 40px rgba(0,0,0,.4);

    overflow:hidden;

    text-align:center;

}

header{

    background:#0d47a1;

    color:white;

    padding:20px;

}

header h1{

    font-size:32px;

}

header p{

    margin-top:10px;

    font-size:18px;

}

model-viewer{

    width:100%;

    height:600px;

    background:#eeeeee;

}

.boton{

    margin:20px;

}

button{

    padding:15px 35px;

    border:none;

    border-radius:12px;

    background:#0d47a1;

    color:white;

    font-size:18px;

    cursor:pointer;

    transition:.3s;

}

button:hover{

    background:#1565c0;

    transform:scale(1.05);

}

footer{

    padding:20px;

    color:#555;

}

</style>

</head>

<body>

<div class="contenedor">

<header>

<h1>Realidad Aumentada</h1>

<p>
Pulsa el botón de Realidad Aumentada para visualizar la figura en tu entorno.
</p>

</header>

<model-viewer

id="visor"

src="figuras.glb"

alt="Modelo 3D"

camera-controls

touch-action="pan-y"

shadow-intensity="1"

exposure="1"

auto-rotate

ar

ar-modes="scene-viewer webxr quick-look"

style="background:#f5f5f5;">

</model-viewer>

<div class="boton">

<button onclick="abrirAR()">

Ver en Realidad Aumentada

</button>

</div>

<footer>

Compatible con Android (Chrome) e iPhone (Safari).

</footer>

</div>

<script>

function abrirAR(){

document.getElementById("visor").activateAR();

}

</script>

</body>
</html>
